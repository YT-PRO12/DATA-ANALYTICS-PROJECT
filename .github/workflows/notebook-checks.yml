name: Validate analysis notebook
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  notebook:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python scripts
        run: python -m compileall -q scripts
      - name: Check saved notebook structure
        run: python scripts/validate_notebook.py
      - name: Inventory committed notebook cells
        run: python scripts/notebook_inventory.py
